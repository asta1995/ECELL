<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CELL - Topup Otomatis</title>
<style>
:root{--blue:#0D3B8C;--orange:#FF6A00;--bg:#F4F7FF}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:var(--bg)} .header{background:var(--blue);color:white;padding:14px;display:flex;gap:10px;position:sticky;top:0;z-index:20}
.logo{width:40px;height:40px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--blue)}
.tabs{display:flex;background:white;margin:12px;border-radius:14px;padding:5px;gap:4px}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}
.tab.active{background:var(--orange);color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #eef2ff}
.price{font-weight:900;color:var(--blue)} .paybox{background:white;margin:12px;border-radius:18px;padding:16px}
.inp{width:100%;padding:10px;border-radius:10px;border:1.5px solid #ddd;margin-top:6px}
.btn{width:100%;margin-top:8px;background:var(--orange);color:white;border:0;padding:10px;border-radius:10px;font-weight:900}
</style>
</head>
<body>
<div class="header"><div class="logo">E</div><div><b>E-CELL</b><div style="font-size:10px">Rek a/n WARJAYA | QRIS a/n E CELL | Backend: asta1995-ecell-backend</div></div><div style="margin-left:auto;background:#00E676;color:#003d12;padding:5px 10px;border-radius:99px;font-size:10px;font-weight:900">AUTO ON</div></div>
<div class="tabs"><div class="tab active" id="t-game" onclick="showTab('game')">🎮 Game</div><div class="tab" id="t-ppob" onclick="showTab('ppob')">📱 PPOB</div><div class="tab" id="t-bayar" onclick="showTab('bayar')">💳 Bayar</div></div>

<div id="game">
<div style="padding:0 12px 10px"><select id="gameDropdown" onchange="filterGame()" style="width:100%;padding:12px;border-radius:12px;border:2px solid #0D3B8C;font-weight:800"><option value="ALL">Semua Game</option><option value="MLBB">Mobile Legends</option><option value="FF">Free Fire</option><option value="PUBG">PUBG Mobile</option></select></div>
<div class="grid" id="gameGrid"></div>
</div>

<div id="ppob" style="display:none"><div class="grid"><div class="card">📱<b>Pulsa</b><div class="price">Auto Digiflazz</div></div><div class="card">🌐<b>Data</b><div class="price">Auto</div></div></div></div>

<div id="bayar" style="display:none">
<div class="paybox" style="border-left:5px solid #00BFA5"><h3>QRIS DANA Bisnis a/n E CELL</h3><p style="font-size:12px">NMID ID1026610661583</p><img src="qris-ecell.jpg" style="width:100%;max-width:320px;margin:12px auto;display:block;border-radius:14px"></div>
<div class="paybox" style="border-left:5px solid #00AED6"><h3>QRIS GoPay a/n E CELL (Baru)</h3><p style="font-size:12px">NMID ID1026629373568 - Menunggu terbit baru</p><img src="qris-warjaya.jpg" style="width:100%;max-width:320px;margin:12px auto;display:block;border-radius:14px"></div>
<div class="paybox"><h3>🏦 Rekening a/n WARJAYA</h3><div id="bankList"></div></div>
</div>

<script>
const CONFIG = { BACKEND_URL: 'https://asta1995-ecell-backend.vercel.app' };
const products = [
  { id: 'mlbb12', game: 'MLBB', name: '12 Diamond', sku: 'mlbb12', modal: 5000 },
  { id: 'mlbb86', game: 'MLBB', name: '86 Diamond', sku: 'xl10000', modal: 21000 },
  { id: 'ff70', game: 'FF', name: '70 Diamond', sku: 'freefire70', modal: 10000 },
  { id: 'pubg60', game: 'PUBG', name: '60 UC', sku: 'pubg60', modal: 14000 },
];
const banks = [
  { name: 'Neo Bank', no: '5859459406987262', owner: 'WARJAYA' },
  { name: 'Mandiri', no: '1370022647966', owner: 'WARJAYA' },
  { name: 'Superbank', no: '030018699543', owner: 'WARJAYA' },
];
function hitungJual(m){ return m<=15000?m+1000:m+2000; }
function renderGame(f='ALL'){
  const grid=document.getElementById('gameGrid'); grid.innerHTML='';
  const list=f==='ALL'?products:products.filter(p=>p.game===f);
  list.forEach(p=>{
    const jual=hitungJual(p.modal);
    grid.innerHTML+=`<div class='card'><div style='font-size:10px;font-weight:800'>${p.game}</div><b>${p.name}</b><div class='price'>Rp ${jual.toLocaleString('id-ID')}</div><input class='inp' id='id-${p.id}' placeholder='ID Game'><button class='btn' onclick="order('${p.id}')">BELI - Otomatis</button></div>`;
  });
}
async function order(pid){
  const p=products.find(x=>x.id===pid);
  const cust=document.getElementById(`id-${pid}`).value;
  if(!cust) return alert('Isi ID dulu Bos');
  const b=event.target; b.innerText='PROSES...';
  try{
    const r=await fetch(`${CONFIG.BACKEND_URL}/api/order`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:p.sku,customer_no:cust,game:p.game,product_name:p.name})});
    const d=await r.json(); alert(d.message); b.innerText='BELI - Otomatis';
  }catch(e){ alert('Error: '+e.message); b.innerText='BELI - Otomatis'; }
}
function filterGame(){ renderGame(document.getElementById('gameDropdown').value); }
function showTab(id){ document.getElementById('game').style.display=id=='game'?'block':'none'; document.getElementById('ppob').style.display=id=='ppob'?'block':'none'; document.getElementById('bayar').style.display=id=='bayar'?'block':'none'; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('t-'+id).classList.add('active'); }
function renderBank(){ document.getElementById('bankList').innerHTML=banks.map(b=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div><b>${b.name} a/n ${b.owner}</b><div style="font-size:11px">•••• ${b.no.slice(-5)}</div></div><button onclick="navigator.clipboard.writeText('${b.no}')">Salin</button></div>`).join(''); }
document.addEventListener('DOMContentLoaded',()=>{ renderGame('ALL'); renderBank(); });
</script>
</body>
</html>
