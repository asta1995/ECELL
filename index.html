<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CELL - Topup Game & Pulsa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#108EE9">
<style>
:root{--blue:#108EE9;--bg:#F7F9FC}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);padding-bottom:90px}
.header{background:white;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 12px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.logo{width:42px;height:42px;border-radius:12px;background:#108EE9;display:flex;align-items:center;justify-content:center;color:white;font-weight:900}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;white-space:nowrap;position:sticky;top:60px;background:var(--bg);z-index:9}
.tab{padding:8px 16px;border-radius:99px;border:1px solid #E5EAF1;background:white;font-size:12px;font-weight:700;cursor:pointer}
.tab.active{background:#108EE9;color:white;border-color:#108EE9}
.grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:white;border-radius:16px;padding:14px;border:1px solid #EEF2F7}
.price{font-weight:900;margin-top:4px;font-size:12px}
.btn{width:100%;background:#111;color:white;border:0;padding:10px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer;font-size:12px}
.card{background:white;border-radius:20px;padding:16px;margin:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid #EEF2F7}
.inp{width:100%;padding:12px;border:1px solid #E5EAF1;border-radius:12px;margin-top:8px}
.pay{border:1.5px solid #E5EAF1;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-top:10px;cursor:pointer}
.pay.active{border-color:#108EE9;background:#F0F7FF}
.wa{position:fixed;bottom:16px;right:16px;background:#25D366;color:white;padding:12px 18px;border-radius:99px;text-decoration:none;font-weight:800;font-size:13px;z-index:20}
</style>
</head>
<body>
<div class="header"><div class="logo">E</div><div><b>E-CELL</b><div style="font-size:11px;color:#666">QRIS DANA Business • 24 Jam</div></div></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="card" id="checkout" style="display:none">
<h3 id="ctitle"></h3><div id="detail" style="font-weight:700;margin-top:6px;font-size:13px"></div>
<input class="inp" id="custId" placeholder="Masukkan ID Game / No HP">
<div style="margin-top:12px;font-weight:700;font-size:12px">Metode Bayar</div>
<div class="pay active" onclick="selPay(this,'qris')"><b>📱 QRIS</b><span style="font-size:11px;color:#666"> - DANA Business</span></div>
<div class="pay" onclick="selPay(this,'bank')"><b>🏦 Transfer Bank</b><span style="font-size:11px;color:#666"> - Mandiri Utama</span></div>
<div id="boxQris" style="margin-top:12px;text-align:center;border:1px dashed #108EE9;border-radius:16px;padding:12px"><img src="qris-e-cell.jpg" style="width:100%;max-width:280px;border-radius:12px"><div style="font-size:11px;color:#666;margin-top:6px">Scan QR untuk bayar</div></div>
<div id="boxBank" style="display:none;margin-top:12px"></div>
<button class="btn" style="background:#108EE9;margin-top:12px" onclick="bayar()">Bayar Sekarang</button>
</div>
<a class="wa" href="https://wa.me/6283178084316">Bantuan WA</a>
<script>
const INTERNAL = {
 banks: [
  {name:"Mandiri", no:"1370022647966"},
  {name:"Superbank", no:"030018699543"},
  {name:"Neo Bank", no:"5859459406987262"},
 ],
 getPrice: m => {
  if(m < 5000) return m;
  if(m >= 5000 && m <= 9999) return m + 500;
  if(m >= 10000 && m <= 19999) return m + 1500;
  return m + 2000;
 }
};
const categories = ["Semua","Pulsa","Data","Game","E-Wallet","PLN","Digital"];
const products = [
 {cat:"Pulsa", name:"Pulsa Telkomsel 10K", modal:10000}, {cat:"Pulsa", name:"Pulsa Telkomsel 25K", modal:25000}, {cat:"Pulsa", name:"Pulsa Indosat 10K", modal:10000}, {cat:"Data", name:"Kuota Telkomsel 2GB", modal:20000}, {cat:"Data", name:"Kuota Indosat 5GB", modal:25000}, {cat:"Game", name:"12 Diamond MLBB", modal:5000}, {cat:"Game", name:"86 Diamond MLBB", modal:21000}, {cat:"Game", name:"70 Diamond FF", modal:10000}, {cat:"Game", name:"140 Diamond FF", modal:20000}, {cat:"E-Wallet", name:"DANA 20K", modal:20000}, {cat:"E-Wallet", name:"GoPay 20K", modal:20000}, {cat:"PLN", name:"Token PLN 20K", modal:20000}, {cat:"PLN", name:"Token PLN 50K", modal:50000}, {cat:"Digital", name:"Voucher Google Play 20K", modal:20000},
];
let activeCat="Semua", selected=null, payMethod="qris";
function renderTabs(){document.getElementById('tabs').innerHTML=categories.map(c=>`<div class="tab ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');}
function setCat(c){activeCat=c;renderTabs();render();}
function render(){const g=document.getElementById('grid');const list=activeCat==="Semua"?products:products.filter(p=>p.cat===activeCat || (activeCat==="Digital" && p.cat==="Digital"));g.innerHTML=list.map(p=>`<div class="item"><div style="font-size:9px;color:#666;background:#F2F4F7;display:inline-block;padding:2px 6px;border-radius:4px">${p.cat}</div><div style="font-weight:700;font-size:12px;margin-top:4px">${p.name}</div><div class="price">Rp ${INTERNAL.getPrice(p.modal).toLocaleString('id-ID')}</div><div style="font-size:9px;color:#999">Modal ${p.modal.toLocaleString('id-ID')}</div><button class="btn" onclick="openCheckout('${p.name}',${p.modal})">Pilih</button></div>`).join('');}
function openCheckout(name,modal){selected={name,modal};document.getElementById('ctitle').innerText=name;document.getElementById('detail').innerText=`Harga: Rp ${INTERNAL.getPrice(modal).toLocaleString('id-ID')} (Modal ${modal.toLocaleString('id-ID')})`;document.getElementById('checkout').style.display='block';renderBank();window.scrollTo(0,document.body.scrollHeight);}
function selPay(el,t){document.querySelectorAll('.pay').forEach(e=>e.classList.remove('active'));el.classList.add('active');payMethod=t;document.getElementById('boxQris').style.display=t==='qris'?'block':'none';document.getElementById('boxBank').style.display=t==='bank'?'block':'none';}
function renderBank(){document.getElementById('boxBank').innerHTML=INTERNAL.banks.map(b=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div><b style="font-size:12px">${b.name}</b><div style="font-size:10px;color:#666">•••• ${b.no.slice(-4)}</div></div><button onclick="navigator.clipboard.writeText('${b.no}')" style="background:#108EE9;color:white;border:0;padding:6px 12px;border-radius:8px;font-size:11px">Salin</button></div>`).join('');}
function bayar(){if(!document.getElementById('custId').value)return alert('Isi ID tujuan');alert(`Pesanan ${selected.name} diproses via ${payMethod.toUpperCase()}.`);}
renderTabs();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
