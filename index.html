<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-CELL PRO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style>
</head>
<body class="bg-[#0b0b0b] text-white antialiased">
<header class="sticky top-0 z-40 bg-black/90 backdrop-blur-xl border-b border-zinc-800">
  <div class="max-w-lg mx-auto flex justify-between items-center p-4">
    <div class="flex items-center gap-3">
      <img src="icon-192.png" onerror="this.src='https://via.placeholder.com/192/000/22ff66?text=E'" class="w-10 h-10 rounded-xl border border-green-500 shadow-[0_0_12px_#22ff66] bg-black">
      <div><h1 class="font-black text-[18px] leading-none tracking-widest">E-CELL PRO</h1><p class="text-[9px] opacity-40 mt-1">ecell.yogya@gmail.com</p></div>
    </div>
    <div id="saldoBox" class="px-3 py-1.5 rounded-full bg-zinc-800 text-[11px] font-bold border border-zinc-700">● LIVE ...</div>
  </div>
</header>

<main class="max-w-lg mx-auto p-4">
  <div class="bg-[#141414] border border-zinc-800 rounded-[20px] p-4">
    <div class="flex justify-between items-center mb-2"><label class="text-[11px] font-bold opacity-50">NOMOR / ID</label><span id="providerBadge" class="text-[10px] px-3 py-1 rounded-full bg-zinc-800 font-black border border-zinc-700">-</span></div>
    <input id="input1" oninput="deteksiProvider()" placeholder="08xx / ID Game / ID PLN" class="w-full p-4 rounded-xl bg-black border border-zinc-800 focus:border-white outline-none font-mono text-[16px]">
    <div id="serverGroup" class="mt-2 hidden"><input id="input2" placeholder="Server (1234 / Asia)" class="w-full p-4 rounded-xl bg-black border border-zinc-800 outline-none font-mono text-[14px]"></div>
  </div>

  <div class="flex gap-2 overflow-x-auto no-scrollbar py-4">
    <button id="cat-pulsa" onclick="setCat('pulsa')" class="cat-btn px-5 py-2.5 rounded-full bg-white text-black text-[12px] font-bold">PULSA</button>
    <button id="cat-data" onclick="setCat('data')" class="cat-btn px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800">DATA</button>
    <button id="cat-game" onclick="setCat('game')" class="cat-btn px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800">GAME</button>
    <button id="cat-ewallet" onclick="setCat('ewallet')" class="cat-btn px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800">E-WALLET</button>
    <button id="cat-digital" onclick="setCat('digital')" class="cat-btn px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800">DIGITAL</button>
  </div>

  <div id="filterBox" class="mb-4"></div>
  <div id="produkList" class="grid grid-cols-2 gap-3"></div>

  <div id="detailBox" class="hidden mt-5 bg-white text-black rounded-[20px] p-5">
    <h3 class="font-black text-[11px] opacity-60">DETAIL & BENEFIT</h3>
    <div id="detailContent" class="text-[13px] mt-3 leading-relaxed"></div>
    <div class="flex justify-between items-center mt-4 pt-4 border-t"><span class="text-[11px] opacity-50">TOTAL BAYAR</span><span id="hargaJual" class="font-black text-[22px]"></span></div>
    <button onclick="goStep2()" class="w-full mt-4 p-4 bg-black text-white font-black rounded-xl">LANJUTKAN</button>
  </div>

  <div id="step2" class="hidden mt-5 bg-[#141414] p-5 rounded-[20px] border border-zinc-800"><div id="confirmId" class="p-3 bg-black rounded-xl font-mono text-[12px] border border-zinc-800"></div><div id="totalBayar" class="text-[28px] font-black mt-4"></div><button onclick="bayar()" class="w-full mt-4 p-4 bg-white text-black font-black rounded-xl">BAYAR</button></div>
  <div id="step3" class="hidden mt-5 bg-[#141414] rounded-[20px] p-8 text-center border border-zinc-800"><div class="text-5xl">✅</div><h2 class="font-black mt-3">Sukses!</h2><p id="refIdShow" class="font-mono text-[11px] mt-3 bg-black p-3 rounded-xl border border-zinc-800"></p></div>
</main>

<footer class="max-w-lg mx-auto mt-12 border-t border-zinc-800 p-6 text-[11px] opacity-60"><div class="flex justify-between"><span>© 2026 E-CELL PRO - All Rights Reserved</span><span>ecell.yogya@gmail.com</span></div></footer>
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur p-4"><div class="max-w-lg mx-auto mt-20 bg-[#141414] border border-zinc-800 rounded-[24px] p-6"><div class="flex justify-between"><h3 id="modalTitle" class="font-black"></h3><button onclick="closeModal()" class="w-8 h-8 bg-zinc-800 rounded-full">✕</button></div><div id="modalBody" class="text-[13px] mt-4 opacity-80"></div></div></div>

<script>
const API_BASE="https://ecell-theta-ten.vercel.app";
let selected=null, currentCat='pulsa', providerCode=null, filterGame='all', filterEwallet='all', filterDigital='all';

function hitungMarkup(modal){
  modal=Number(modal);
  if(modal>=5000 && modal<=9999) return modal+500;
  if(modal>=10000 && modal<=15999) return modal+1500;
  return modal+2000;
}

const allProduk={
  pulsa:[
    {sku:"tsel5",base:5000,name:"5rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 5rb<br>• Masa 7 hari"},
    {sku:"tsel10",base:10000,name:"10rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 10rb<br>• Masa 15 hari"},
    {sku:"tsel20",base:20000,name:"20rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 20rb<br>• Masa 30 hari"},
    {sku:"tsel50",base:50000,name:"50rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 50rb"},
    {sku:"isat10",base:10000,name:"10rb",provider:"isat",game:"indosat",detail:"• ISAT 10rb"},
    {sku:"xl10",base:10000,name:"10rb",provider:"xl",game:"xl",detail:"• XL 10rb"},
    {sku:"axis5",base:5000,name:"5rb",provider:"axis",game:"axis",detail:"• AXIS 5rb"},
    {sku:"axis10",base:10000,name:"10rb",provider:"axis",game:"axis",detail:"• AXIS 10rb"},
    {sku:"axis20",base:20000,name:"20rb",provider:"axis",game:"axis",detail:"• AXIS 20rb"},
    {sku:"tri10",base:10000,name:"10rb",provider:"tri",game:"tri",detail:"• TRI 10rb"},
  ],
  data:[
    {sku:"tsel-d1",base:15000,name:"1.5GB - 3hr",provider:"tsel",game:"telkomsel",detail:"• 1GB+500MB<br>• 3hr"},
    {sku:"axis-d5",base:20000,name:"5GB - 7hr",provider:"axis",game:"axis",detail:"• AXIS 5GB<br>• 7hr<br>• 0831"},
  ],
  game:[
    {sku:"ff70",base:8000,name:"70 Diamond",game:"freefire",provider:"freefire",detail:"• ID saja<br>• +7 Bonus",need:"id_only"},
    {sku:"ml86",base:20000,name:"86 Diamond",game:"mlbb",provider:"mlbb",detail:"• ID+Server<br>• +8 Bonus",need:"id_server"},
  ],
  ewallet:[
    {sku:"dana10",base:10000,name:"10rb",game:"dana",provider:"dana",detail:"• DANA 10rb"},
    {sku:"ovo25",base:25000,name:"25rb",game:"ovo",provider:"ovo",detail:"• OVO 25rb"},
  ],
  digital:[
    {sku:"pln20",base:20000,name:"PLN 20rb",game:"pln",provider:"pln",detail:"• ID 11-12 digit<br>• ~13.5 kWh",need:"pln"},
  ]
};

function setCat(c){ currentCat=c; filterGame='all'; filterEwallet='all'; filterDigital='all'; document.querySelectorAll(".cat-btn").forEach(b=>b.className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800"); document.getElementById(`cat-${c}`).className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-white text-black text-[12px] font-bold"; const l=document.getElementById("labelInput"), sG=document.getElementById("serverGroup"); if(c==='game'){ l.innerText="ID GAME + SERVER"; sG.classList.remove("hidden"); } else { sG.classList.add("hidden"); } renderFilter(); render(); }
function renderFilter(){ const box=document.getElementById("filterBox"); if(currentCat==='game'){ box.innerHTML=`<select onchange="filterGame=this.value;render()" class="w-full p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua Game --</option><option value="freefire">Free Fire</option><option value="mlbb">Mobile Legends</option></select>`; } else if(currentCat==='ewallet'){ box.innerHTML=`<select onchange="filterEwallet=this.value;render()" class="w-full p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua E-Wallet --</option><option value="dana">DANA</option><option value="ovo">OVO</option><option value="gopay">GoPay</option></select>`; } else if(currentCat==='pulsa'||currentCat==='data'){ box.innerHTML=`<div class="text-[11px] p-3.5 bg-[#141414] rounded-xl border border-zinc-800 opacity-70">📱 Filter otomatis: 0831=AXIS, 0812=TSEL, 0856=ISAT, 0817=XL, 0896=TRI</div>`; } else { box.innerHTML=""; } }
function deteksiProvider(){ const raw=document.getElementById("input1").value; const num=raw.replace(/\D/g,""); let p="BELUM", code=null, col="bg-zinc-800"; if(/^08(31|32|33|38)/.test(num)){ p="AXIS"; code="axis"; col="bg-purple-600"; } else if(/^08(12|13|21|22|23|51|52|53)/.test(num)){ p="TELKOMSEL"; code="tsel"; col="bg-red-600"; } else if(/^08(14|15|16|55|56|57|58)/.test(num)){ p="INDOSAT"; code="isat"; col="bg-yellow-600"; } else if(/^08(17|18|19|59|77|78)/.test(num)){ p="XL"; code="xl"; col="bg-blue-600"; } else if(/^08(95|96|97|98|99)/.test(num)){ p="TRI"; code="tri"; col="bg-zinc-600"; } else if(num.length>=10){ p="VALID"; code="all"; col="bg-green-600"; } providerCode=code; document.getElementById("providerBadge").innerText=p; document.getElementById("providerBadge").className=`text-[10px] px-3 py-1 rounded-full font-black border ${col} text-white`; render(); }
function render(){ let list=allProduk[currentCat]||[]; if((currentCat==='pulsa'||currentCat==='data')){ if(!providerCode){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-8 text-center bg-[#141414] rounded-[20px] border border-zinc-800 opacity-50 text-[13px]">Masukkan nomor HP dulu Bos</div>`; return; } if(providerCode!=='all') list=list.filter(x=>x.provider===providerCode); } if(currentCat==='game' && filterGame!=='all') list=list.filter(x=>x.game===filterGame); if(currentCat==='ewallet' && filterEwallet!=='all') list=list.filter(x=>x.game===filterEwallet); if(list.length===0){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-6 text-center bg-[#141414] rounded-[20px] border border-zinc-800 text-[13px] opacity-60">Tidak ada produk</div>`; return; } document.getElementById("produkList").innerHTML=list.map(p=>{ const jual=hitungMarkup(p.base); return `<button onclick="pilih('${p.sku}')" class="text-left p-4 rounded-[18px] bg-[#141414] border border-zinc-800 hover:border-zinc-600"><div class="text-[10px] opacity-40 uppercase font-black">${p.provider.toUpperCase()}</div><div class="font-black text-[15px] mt-1">${p.name}</div><div class="text-[11px] opacity-50 mt-1">${p.detail.replace(/<br>/g,' • ')}</div><div class="font-black text-[16px] mt-3">Rp ${jual.toLocaleString()}</div></button>` }).join(""); }
function pilih(sku){ selected=Object.values(allProduk).flat().find(x=>x.sku===sku); document.getElementById("detailBox").classList.remove("hidden"); document.getElementById("detailContent").innerHTML=`<div class="font-black">${selected.name} - ${selected.game.toUpperCase()}</div><div class="mt-2">${selected.detail}</div>`; document.getElementById("hargaJual").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; }
function goStep2(){ const id1=document.getElementById("input1").value.trim(), id2=document.getElementById("input2").value.trim(); if(!id1) return alert("Wajib ID/Nomor!"); if(selected.need==='pln' && !/^\d{11,12}$/.test(id1.replace(/\D/g,""))) return alert("ID PLN 11-12 digit!"); document.getElementById("step2").classList.remove("hidden"); document.getElementById("confirmId").innerText=`${selected.game.toUpperCase()} | ID: ${id1} ${id2?`| SERVER: ${id2}`:''} | ${selected.name}`; document.getElementById("totalBayar").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; }
async function bayar(){ const ref=`ECELL${Date.now()}`; try{await fetch(`${API_BASE}/api/create-order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref_id:ref,produk:selected,noTujuan:document.getElementById("input1").value,server:document.getElementById("input2").value})})}catch{} document.getElementById("step2").classList.add("hidden");document.getElementById("step3").classList.remove("hidden");document.getElementById("refIdShow").innerText=ref; }
function closeModal(){document.getElementById("modal").classList.add("hidden");}
async function fetchSaldo(){ const box=document.getElementById("saldoBox"); try{ const r=await fetch(`${API_BASE}/api/cek-saldo`,{mode:'cors'}); const d=await r.json(); const saldo=Number(d.saldo||0); box.innerText=`● LIVE Rp ${saldo.toLocaleString()}`; box.className=`px-3 py-1.5 rounded-full text-[11px] font-bold border ${saldo<50000?'bg-red-600 border-red-500':'bg-green-600 border-green-500'}`; } catch(e){ box.innerText=`● ONLINE`; box.className=`px-3 py-1.5 rounded-full text-[11px] font-bold border bg-zinc-800 border-zinc-700`; } }
setCat('pulsa'); renderFilter(); fetchSaldo(); setInterval(fetchSaldo,30000); deteksiProvider();
</script>
</body>
</html>
