function setCat(c){
  currentCat=c; filterGame='all'; filterEwallet='all'; filterDigital='all';
  document.querySelectorAll(".cat-btn").forEach(b=>b.className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800");
  document.getElementById(`cat-${c}`).className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-white text-black text-[12px] font-bold";
  const label=document.getElementById("labelInput"), sG=document.getElementById("serverGroup");
  if(c==='game'){ label.innerText="ID GAME + SERVER (WAJIB)"; sG.classList.remove("hidden"); document.getElementById("input1").placeholder="ID Game (12345678)"; document.getElementById("input2").placeholder="Server (1234 / Asia)"; }
  else if(c==='ewallet'){ label.innerText="NOMOR E-WALLET"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="08xx DANA/OVO/GoPay"; }
  else if(c==='digital'){ label.innerText="ID PELANGGAN PLN / AKUN"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="ID PLN 11-12 digit / Email"; }
  else { label.innerText="NOMOR HP - FILTER PROVIDER"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="08xxxxxxxxxx"; }
  renderFilter(); render();
}

function renderFilter(){
  const box=document.getElementById("filterBox");
  if(currentCat==='game'){
    box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH GAME (DROPDOWN):</label><select id="gameSelect" onchange="filterGame=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua Game --</option><option value="freefire">🔥 Free Fire</option><option value="mlbb">⭐ Mobile Legends</option><option value="pubg">🎯 PUBG Mobile</option><option value="genshin">✨ Genshin Impact</option></select>`;
  } else if(currentCat==='ewallet'){
    box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH E-WALLET (DROPDOWN):</label><select onchange="filterEwallet=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua E-Wallet --</option><option value="dana">💙 DANA</option><option value="ovo">💜 OVO</option><option value="gopay">💚 GoPay</option><option value="shopeepay">🧡 ShopeePay</option><option value="linkaja">❤️ LinkAja</option></select>`;
  } else if(currentCat==='pulsa'||currentCat==='data'){
    box.innerHTML=`<div class="text-[11px] p-3.5 bg-[#141414] rounded-xl border border-zinc-800 opacity-70">📱 Ketik nomor HP di atas: 0831=AXIS • 0812=TSEL • 0856=ISAT • 0817=XL • 0896=TRI - Produk filter otomatis</div>`;
  } else {
    box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH DIGITAL:</label><select onchange="filterDigital=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua --</option><option value="pln">⚡ PLN Token (Wajib ID 11-12 digit)</option><option value="netflix">🎬 Netflix / Spotify</option></select>`;
  }
}

function deteksiProvider(){
  const raw=document.getElementById("input1").value; const num=raw.replace(/\D/g,""); let p="BELUM", code=null, col="bg-zinc-800 border-zinc-700";
  if(/^08(31|32|33|38)/.test(num)){ p="AXIS"; code="axis"; col="bg-purple-600 border-purple-500"; }
  else if(/^08(12|13|21|22|23|51|52|53)/.test(num)){ p="TELKOMSEL"; code="tsel"; col="bg-red-600 border-red-500"; }
  else if(/^08(14|15|16|55|56|57|58)/.test(num)){ p="INDOSAT"; code="isat"; col="bg-yellow-600 border-yellow-500"; }
  else if(/^08(17|18|19|59|77|78)/.test(num)){ p="XL"; code="xl"; col="bg-blue-600 border-blue-500"; }
  else if(/^08(95|96|97|98|99)/.test(num)){ p="TRI"; code="tri"; col="bg-zinc-600 border-zinc-500"; }
  else if(num.length>=10){ p="VALID"; code="all"; col="bg-green-600 border-green-500"; }
  providerCode=code;
  document.getElementById("providerBadge").innerText=p;
  document.getElementById("providerBadge").className=`text-[10px] px-3 py-1 rounded-full font-black border ${col} text-white`;
  render();
}

function render(){
  let list=allProduk[currentCat]||[];
  if((currentCat==='pulsa'||currentCat==='data')){
    if(!providerCode){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-8 text-center bg-[#141414] rounded-[20px] border border-zinc-800 opacity-50 text-[13px]">Masukkan nomor HP dulu Bos<br>0831=AXIS, 0812=TSEL</div>`; return; }
    if(providerCode!=='all') list=list.filter(x=>x.provider===providerCode);
  }
  if(currentCat==='game' && filterGame!=='all') list=list.filter(x=>x.game===filterGame);
  if(currentCat==='ewallet' && filterEwallet!=='all') list=list.filter(x=>x.game===filterEwallet);
  if(currentCat==='digital' && filterDigital!=='all') list=list.filter(x=>x.game===filterDigital || (filterDigital==='pln' && x.game==='pln') || (filterDigital==='netflix' && (x.game==='netflix'||x.game==='spotify')));

  if(list.length===0){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-8 text-center bg-[#141414] rounded-[20px] border border-zinc-800 text-[13px] opacity-60">Tidak ada produk untuk filter ini, coba pilih Semua</div>`; return; }

  // GRID BERSIH TANPA MODAL
  document.getElementById("produkList").innerHTML=list.map(p=>{
    const jual=hitungMarkup(p.base);
    return `<button onclick="pilih('${p.sku}')" class="text-left p-4 rounded-[18px] bg-[#141414] border border-zinc-800 hover:border-zinc-600 hover:bg-[#1a1a1a] transition"><div class="text-[10px] opacity-40 uppercase font-black tracking-widest">${p.game} • ${p.provider.toUpperCase()}</div><div class="font-black text-[15px] mt-1">${p.name}</div><div class="text-[11px] opacity-50 mt-1.5 line-clamp-2 leading-relaxed">${p.detail.replace(/<br>/g,' • ')}</div><div class="font-black text-[16px] mt-3">Rp ${jual.toLocaleString()}</div></button>`
  }).join("");
}

function pilih(sku){ selected=Object.values(allProduk).flat().find(x=>x.sku===sku); document.getElementById("detailBox").classList.remove("hidden"); document.getElementById("detailContent").innerHTML=`<div class="font-black text-[14px]">${selected.name} - ${selected.game.toUpperCase()}</div><div class="mt-3 leading-relaxed">${selected.detail}</div><div class="mt-3 p-3 bg-zinc-100 rounded-xl text-[12px]">✅ Garansi 100% Masuk / Refund 30 menit<br>✅ Proses: 1-5 Menit Otomatis</div>`; document.getElementById("hargaJual").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; window.scrollTo({top:document.getElementById("detailBox").offsetTop-80,behavior:'smooth'}); }
function goStep2(){ const id1=document.getElementById("input1").value.trim(), id2=document.getElementById("input2").value.trim(); if(currentCat==='game'){ if(!id1) return alert("Wajib ID Game Bos!"); if(selected.game==='mlbb' && !id2) return alert("Wajib Server Bos! Contoh: 1234"); if(selected.game==='genshin' && !id2) return alert("Wajib Server: Asia/America/Europe"); } if(selected.need==='pln' && !/^\d{11,12}$/.test(id1.replace(/\D/g,""))) return alert("ID PLN 11-12 digit Bos!"); if((currentCat==='pulsa'||currentCat==='data'||currentCat==='ewallet') && !/^\d{10,13}$/.test(id1.replace(/\D/g,""))) return alert("Nomor HP 10-13 digit!"); document.getElementById("step2").classList.remove("hidden"); document.getElementById("confirmId").innerText=`${selected.game.toUpperCase()} | ID: ${id1} ${id2?`| SERVER: ${id2}`:''} | ${selected.name} | Bayar: Rp ${hitungMarkup(selected.base).toLocaleString()}`; document.getElementById("totalBayar").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; }
async function bayar(){ const ref=`ECELL${Date.now()}`; try{await fetch(`${API_BASE}/api/create-order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref_id:ref,produk:selected,noTujuan:document.getElementById("input1").value,server:document.getElementById("input2").value})})}catch{} document.getElementById("step2").classList.add("hidden");document.getElementById("step3").classList.remove("hidden");document.getElementById("refIdShow").innerText=ref; }
function closeModal(){document.getElementById("modal").classList.add("hidden");}
async function fetchSaldo(){ const box=document.getElementById("saldoBox"); try{ const r=await fetch(`${API_BASE}/api/cek-saldo`,{mode:'cors'}); const d=await r.json(); const saldo=Number(d.saldo||0); box.innerText=`● LIVE Rp ${saldo.toLocaleString()}`; box.className=`px-3 py-1.5 rounded-full text-[11px] font-bold border ${saldo<50000?'bg-red-600 border-red-500 animate-pulse':'bg-green-600 border-green-500'}`; } catch(e){ box.innerText=`● ONLINE`; } }

// INIT - DEFAULT GAME BOS
setCat('game'); renderFilter(); fetchSaldo(); setInterval(fetchSaldo,30000); render();
