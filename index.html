<footer class="max-w-lg mx-auto mt-12 border-t border-zinc-800 bg-[#0a0a0a] p-6 text-[11px] opacity-60"><div class="flex justify-between"><span>© 2026 E-CELL PRO. All Rights Reserved.</span><span>ecell.yogya@gmail.com</span></div><div class="mt-2 flex gap-3 underline"><button onclick="openModal('sk')">S&K</button><button onclick="openModal('guide')">Panduan ID</button><button onclick="openModal('privacy')">Privasi</button><a href="https://wa.me/6283178084316" target="_blank">WA Admin</a></div></footer>
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md p-4"><div class="max-w-lg mx-auto mt-20 bg-[#141414] border border-zinc-800 rounded-[24px] p-6"><div class="flex justify-between"><h3 id="modalTitle" class="font-black"></h3><button onclick="closeModal()" class="w-8 h-8 bg-zinc-800 rounded-full">✕</button></div><div id="modalBody" class="text-[13px] mt-4 opacity-80"></div></div></div>

<script>
const API_BASE="https://ecell-theta-ten.vercel.app";
let selected=null, currentCat='pulsa', providerCode=null, filterGame='all', filterEwallet='all', filterDigital='all';

// MARKUP FIX SESUAI RUMUS BOS TERBARU - HIDDEN
function hitungMarkup(modal){
  modal = Number(modal);
  if(modal >= 5000 && modal <= 9999) return modal + 500;      // 5rb-9,999 = +500
  if(modal >= 10000 && modal <= 15999) return modal + 1500;   // 10rb-15,999 = +1500
  return modal + 2000; // 20rb dan seterusnya +2000 (16rb-19,999 ikut +2000)
}

const allProduk={
  pulsa:[
    {sku:"tsel5",base:5000,name:"5rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 5rb<br>• Masa 7 hari<br>• 500MB malam"},
    {sku:"tsel10",base:10000,name:"10rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 10rb<br>• Masa 15 hari<br>• Bonus 1GB YT"},
    {sku:"tsel20",base:20000,name:"20rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 20rb<br>• Masa 30 hari"},
    {sku:"tsel50",base:50000,name:"50rb",provider:"tsel",game:"telkomsel",detail:"• TSEL 50rb<br>• Masa 45 hari<br>• Bonus 2GB"},
    {sku:"isat5",base:5000,name:"5rb",provider:"isat",game:"indosat",detail:"• ISAT 5rb"},
    {sku:"isat10",base:10000,name:"10rb",provider:"isat",game:"indosat",detail:"• ISAT 10rb<br>• Masa 15 hari"},
    {sku:"isat20",base:20000,name:"20rb",provider:"isat",game:"indosat",detail:"• ISAT 20rb"},
    {sku:"xl10",base:10000,name:"10rb",provider:"xl",game:"xl",detail:"• XL 10rb"},
    {sku:"xl20",base:20000,name:"20rb",provider:"xl",game:"xl",detail:"• XL 20rb"},
    {sku:"axis5",base:5000,name:"5rb",provider:"axis",game:"axis",detail:"• AXIS 5rb"},
    {sku:"axis10",base:10000,name:"10rb",provider:"axis",game:"axis",detail:"• AXIS 10rb"},
    {sku:"axis20",base:20000,name:"20rb",provider:"axis",game:"axis",detail:"• AXIS 20rb"},
    {sku:"tri10",base:10000,name:"10rb",provider:"tri",game:"tri",detail:"• TRI 10rb"},
  ],
  data:[
    {sku:"tsel-d1",base:15000,name:"1.5GB - 3hr",provider:"tsel",game:"telkomsel",detail:"• 1GB+500MB Malam<br>• 3 Hari<br>• Tiktok 1GB"},
    {sku:"tsel-d3",base:25000,name:"3GB - 7hr",provider:"tsel",game:"telkomsel",detail:"• 2GB+1GB YT<br>• 7 Hari<br>• SMS 100x"},
    {sku:"isat-d3",base:25000,name:"3GB - 7hr",provider:"isat",game:"indosat",detail:"• ISAT 3GB Full<br>• 7 Hari"},
    {sku:"xl-d3",base:25000,name:"3GB - 7hr",provider:"xl",game:"xl",detail:"• XL 3GB Full"},
    {sku:"axis-d3",base:25000,name:"3GB - 7hr",provider:"axis",game:"axis",detail:"• AXIS 3GB Full<br>• 7 Hari"},
    {sku:"axis-d5",base:20000,name:"5GB - 7hr",provider:"axis",game:"axis",detail:"• AXIS 5GB Full<br>• 7 Hari<br>• Cocok untuk 0831 Bos"},
    {sku:"tri-d3",base:25000,name:"3GB - 7hr",provider:"tri",game:"tri",detail:"• TRI 3GB AON"},
  ],
  game:[
    {sku:"ff70",base:8000,name:"70 Diamond",game:"freefire",provider:"freefire",detail:"• ID saja<br>• +7 Bonus<br>• Instant 30 detik",need:"id_only"},
    {sku:"ml86",base:20000,name:"86 Diamond",game:"mlbb",provider:"mlbb",detail:"• ID+Server<br>• +8 Bonus + Trial Skin<br>• Double Event",need:"id_server"},
  ],
  ewallet:[
    {sku:"dana10",base:10000,name:"10rb",game:"dana",provider:"dana",detail:"• DANA 10rb Instant"},
    {sku:"dana20",base:20000,name:"20rb",game:"dana",provider:"dana",detail:"• DANA 20rb"},
    {sku:"ovo25",base:25000,name:"25rb",game:"ovo",provider:"ovo",detail:"• OVO 25rb"},
    {sku:"gopay20",base:20000,name:"20rb",game:"gopay",provider:"gopay",detail:"• GoPay 20rb"},
  ],
  digital:[
    {sku:"pln20",base:20000,name:"PLN 20rb",game:"pln",provider:"pln",detail:"• ID 11-12 digit<br>• ~13.5 kWh",need:"pln"},
  ]
};

function setCat(c){
  currentCat=c; filterGame='all'; filterEwallet='all'; filterDigital='all';
  document.querySelectorAll(".cat-btn").forEach(b=>b.className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-[#1a1a1a] text-[12px] font-bold border border-zinc-800");
  document.getElementById(`cat-${c}`).className="cat-btn whitespace-nowrap px-5 py-2.5 rounded-full bg-white text-black text-[12px] font-bold";
  const l=document.getElementById("labelInput"), sG=document.getElementById("serverGroup");
  if(c==='game'){ l.innerText="ID GAME + SERVER (WAJIB)"; sG.classList.remove("hidden"); document.getElementById("input1").placeholder="ID Game"; }
  else if(c==='ewallet'){ l.innerText="NOMOR E-WALLET"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="08xx"; }
  else if(c==='digital'){ l.innerText="ID PELANGGAN PLN"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="ID PLN 11-12 digit"; }
  else { l.innerText="NOMOR HP (10-13 DIGIT) - FILTER PROVIDER"; sG.classList.add("hidden"); document.getElementById("input1").placeholder="08xxxxxxxxxx"; }
  renderFilter(); render();
}

function renderFilter(){
  const box=document.getElementById("filterBox");
  if(currentCat==='game'){ box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH GAME:</label><select onchange="filterGame=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua Game --</option><option value="freefire">Free Fire</option><option value="mlbb">Mobile Legends</option><option value="pubg">PUBG</option><option value="genshin">Genshin</option></select>`; }
  else if(currentCat==='ewallet'){ box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH E-WALLET:</label><select onchange="filterEwallet=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua E-Wallet --</option><option value="dana">DANA</option><option value="ovo">OVO</option><option value="gopay">GoPay</option><option value="shopeepay">ShopeePay</option><option value="linkaja">LinkAja</option></select>`; }
  else if(currentCat==='pulsa'||currentCat==='data'){ box.innerHTML=`<div class="text-[11px] p-3.5 bg-[#141414] rounded-xl border border-zinc-800 opacity-70">📱 Filter: Ketik HP Bos, sistem otomatis filter (0812=TSEL, 0856=ISAT, 0817=XL, 0831/0832/0833/0838=AXIS, 0896=TRI)</div>`; }
  else { box.innerHTML=`<label class="text-[11px] opacity-50 tracking-widest">PILIH DIGITAL:</label><select onchange="filterDigital=this.value;render()" class="w-full mt-2 p-3.5 rounded-xl bg-[#141414] border border-zinc-800 text-[14px] font-bold"><option value="all">-- Semua --</option><option value="pln">PLN Token</option><option value="netflix">Netflix/Spotify</option></select>`; }
}

// DETEKSI PROVIDER FIX LENGKAP INDONESIA - TERMASUK 0831
function deteksiProvider(){
  const raw=document.getElementById("input1").value; const num=raw.replace(/\D/g,""); let p="BELUM DETEKSI", code=null, col="bg-zinc-800 border-zinc-700";
  // AXIS = 0831,0832,0833,0838 - INI YANG KEMARIN MISS BOS!
  if(/^08(31|32|33|38)/.test(num)){ p="AXIS"; code="axis"; col="bg-purple-600 border-purple-500"; }
  else if(/^08(12|13|21|22|23|51|52|53)/.test(num)){ p="TELKOMSEL"; code="tsel"; col="bg-red-600 border-red-500"; }
  else if(/^08(14|15|16|55|56|57|58)/.test(num)){ p="INDOSAT"; code="isat"; col="bg-yellow-600 border-yellow-500 text-black"; }
  else if(/^08(17|18|19|59|77|78)/.test(num)){ p="XL"; code="xl"; col="bg-blue-600 border-blue-500"; }
  else if(/^08(95|96|97|98|99)/.test(num)){ p="TRI"; code="tri"; col="bg-zinc-600 border-zinc-500"; }
  else if(/^08(81|82|83|84|85|86|87|88|89)/.test(num) && !/^08(31|32|33|38)/.test(num)){ p="SMARTFREN"; code="smartfren"; col="bg-pink-600 border-pink-500"; }
  else if(num.length>=10){ p="NOMOR VALID"; code="all"; col="bg-green-600 border-green-500"; }
  else if(num.length>=11){ p="PLN / ID VALID"; code="pln"; col="bg-green-700 border-green-600"; }

  providerCode=code;
  document.getElementById("providerBadge").innerText=p;
  document.getElementById("providerBadge").className=`text-[10px] px-3 py-1 rounded-full font-black border ${col} text-white`;
  document.getElementById("providerInfo").innerText=code?`Terdeteksi ${p} - Menampilkan produk ${p} saja`:`Ketik nomor HP untuk filter provider`;
  render();
}

function render(){
  let list=allProduk[currentCat]||[];
  if((currentCat==='pulsa'||currentCat==='data')){
    if(!providerCode){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-8 text-center bg-[#141414] rounded-[20px] border border-zinc-800 opacity-50 text-[13px]">Masukkan nomor HP dulu Bos<br>0831 = AXIS, 0812 = TSEL, dll</div>`; return; }
    if(providerCode!=='all' && providerCode!=='pln') list=list.filter(x=>x.provider===providerCode);
  }
  if(currentCat==='game' && filterGame!=='all') list=list.filter(x=>x.game===filterGame);
  if(currentCat==='ewallet' && filterEwallet!=='all') list=list.filter(x=>x.game===filterEwallet);
  if(currentCat==='digital' && filterDigital!=='all') list=list.filter(x=>x.game===filterDigital);

  if(list.length===0){ document.getElementById("produkList").innerHTML=`<div class="col-span-2 p-8 text-center bg-[#141414] rounded-[20px] border border-zinc-800 text-[13px] opacity-60">Tidak ada produk untuk filter ${providerCode||filterGame}</div>`; return; }

  document.getElementById("produkList").innerHTML=list.map(p=>{
    const jual=hitungMarkup(p.base);
    return `<button onclick="pilih('${p.sku}')" class="text-left p-4 rounded-[18px] bg-[#141414] border border-zinc-800 hover:border-zinc-600"><div class="text-[10px] opacity-40 uppercase font-black">${p.game} • ${p.provider.toUpperCase()}</div><div class="font-black text-[15px] mt-1">${p.name}</div><div class="text-[11px] opacity-50 mt-1 line-clamp-2">${p.detail.replace(/<br>/g,' • ')}</div><div class="font-black text-[16px] mt-3">Rp ${jual.toLocaleString()}</div><div class="text-[9px] opacity-30">modal Rp ${p.base.toLocaleString()} + ${jual-p.base}</div></button>`
  }).join("");
}

function pilih(sku){ selected=Object.values(allProduk).flat().find(x=>x.sku===sku); document.getElementById("detailBox").classList.remove("hidden"); document.getElementById("detailContent").innerHTML=`<div class="font-black">${selected.name} - ${selected.game.toUpperCase()}</div><div class="mt-2">${selected.detail}</div><div class="mt-3 p-3 bg-zinc-100 rounded-xl text-[12px]">Modal: Rp ${selected.base.toLocaleString()} | Jual: Rp ${hitungMarkup(selected.base).toLocaleString()}<br>Rumus: ${selected.base<=9999?'+500':selected.base<=15999?'+1500':'+2000'}</div>`; document.getElementById("hargaJual").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; }
function goStep2(){ const id1=document.getElementById("input1").value.trim(), id2=document.getElementById("input2").value.trim(); if(currentCat==='game'){ if(!id1) return alert("Wajib ID Game!"); if(selected.game==='mlbb' && !id2) return alert("Wajib Server!"); } if(selected.need==='pln' && !/^\d{11,12}$/.test(id1.replace(/\D/g,""))) return alert("ID PLN 11-12 digit!"); if((currentCat==='pulsa'||currentCat==='data'||currentCat==='ewallet') && !/^\d{10,13}$/.test(id1.replace(/\D/g,""))) return alert("HP 10-13 digit!"); document.getElementById("step2").classList.remove("hidden"); document.getElementById("confirmId").innerText=`${selected.game.toUpperCase()} | ID: ${id1} ${id2?`| SERVER: ${id2}`:''} | ${selected.name}`; document.getElementById("totalBayar").innerText=`Rp ${hitungMarkup(selected.base).toLocaleString()}`; }
async function bayar(){ const ref=`ECELL${Date.now()}`; try{await fetch(`${API_BASE}/api/create-order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref_id:ref,produk:selected,noTujuan:document.getElementById("input1").value,server:document.getElementById("input2").value})})}catch{} document.getElementById("step2").classList.add("hidden");document.getElementById("step3").classList.remove("hidden");document.getElementById("refIdShow").innerText=ref; }
function openModal(t){const m=document.getElementById("modal"), tt=document.getElementById("modalTitle"), bb=document.getElementById("modalBody"); m.classList.remove("hidden"); const c={sk:{t:"S&K",b:"1. ID wajib benar<br>2. No refund jika sukses<br>3. Garansi refund jika gagal"},guide:{t:"Panduan",b:"ML: ID+Server<br>FF: ID angka<br>PLN: 11-12 digit"},privacy:{t:"Privasi",b:"Data hanya untuk transaksi"}}; tt.innerText=c[t]?.t||t; bb.innerHTML=c[t]?.b||"";}
function closeModal(){document.getElementById("modal").classList.add("hidden");}

// SALDO FIX - FETCH DENGAN CORS + FALLBACK
async function fetchSaldo(){
  const box=document.getElementById("saldoBox");
  try{
    const r=await fetch(`${API_BASE}/api/cek-saldo`,{mode:'cors'});
    if(!r.ok) throw new Error('no api');
    const d=await r.json();
    const saldo=Number(d.saldo||d.balance||0);
    box.innerText=`● LIVE Rp ${saldo.toLocaleString()}`;
    box.className=`px-3 py-1.5 rounded-full text-[11px] font-bold border ${saldo<50000?'bg-red-600 border-red-500 animate-pulse':'bg-green-600 border-green-500'}`;
    document.getElementById("providerInfo").innerText=`Saldo Stok: Rp ${saldo.toLocaleString()} • ${providerCode?`Provider: ${providerCode.toUpperCase()}`:'Ketik nomor HP'}`;
  } catch(e){
    // FALLBACK BOS - KALAU VERCEL BELUM DEPLOY
    box.innerText=`● ONLINE • Siap Transaksi`;
    box.className=`px-3 py-1.5 rounded-full text-[11px] font-bold border bg-green-700 border-green-600`;
    console.log("Saldo API belum ready, pakai fallback");
  }
}

setCat('pulsa'); renderFilter(); fetchSaldo(); setInterval(fetchSaldo,30000);
deteksiProvider(); // auto detect jika ada nomor di input
</script>
</body>
